name: PR Build Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: stable
  ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}

jobs:
  source_zip:
    name: Source ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          mkdir -p dist
          zip -r "dist/ghostchat-source-${{ github.run_number }}.zip" . \
            -x ".git/*" "build/*" ".dart_tool/*" "node_modules/*" ".idea/*" ".vscode/*" ".env*" "android/key.properties" "*.jks" "*.keystore"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostchat-source-${{ github.run_number }}
          path: dist/ghostchat-source-${{ github.run_number }}.zip
          if-no-files-found: error

  android_apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip APK build when secret is missing
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 == ''
        run: echo "ANDROID_GOOGLE_SERVICES_JSON_B64 is missing. APK build skipped."

      - name: Setup Java
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Generate flutter scaffolding and install deps
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        run: bash scripts/bootstrap_project.sh

      - name: Inject google-services.json
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        run: |
          mkdir -p android/app
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Build release APK
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        run: flutter build apk --release

      - name: Prepare APK artifact
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ghostchat-app-${{ github.run_number }}.apk"
          cd dist
          zip "ghostchat-android-${{ github.run_number }}.zip" "ghostchat-app-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        if: env.ANDROID_GOOGLE_SERVICES_JSON_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ghostchat-android-${{ github.run_number }}
          path: |
            dist/ghostchat-app-${{ github.run_number }}.apk
            dist/ghostchat-android-${{ github.run_number }}.zip
          if-no-files-found: error
